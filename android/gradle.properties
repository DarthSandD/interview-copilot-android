# The Gradle JVM was asking for 8G heap; on this machine that starves the
# Kotlin compiler daemon, which then fails with "Failed connecting to the
# daemon in 4 retries". A smaller heap plus in-process Kotlin compilation
# (no extra JVM) is what actually gets the build through.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Reuse configuration and outputs between builds instead of re-evaluating every
# plugin build script from scratch (this machine is slow at that step).
org.gradle.caching=true
org.gradle.parallel=false
# Compile Kotlin inside the Gradle daemon rather than spawning a separate
# Kotlin daemon that may fail to start.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
